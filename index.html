<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cube Timer</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #1f232c;
    --text: #e8eaf0;
    --muted: #8b90a0;
    --accent: #4f8cff;
    --ready: #37d67a;
    --hold: #ff5c5c;
    --border: #2a2f3a;
    --radius: 12px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "SF Mono", "JetBrains Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
  }
  /* --- sidebar --- */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sidebar header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .sidebar h1 { font-size: 18px; margin: 0; letter-spacing: 0.5px; white-space: nowrap; }
  .sidebar header select { max-width: 170px; }
  .stats {
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .stats .label { color: var(--muted); }
  .stats .value { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  .times {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
  }
  .times table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .times th, .times td { padding: 6px 10px; text-align: right; }
  .times th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  .times td:first-child, .times th:first-child { text-align: left; color: var(--muted); }
  .times tr { cursor: pointer; }
  .times tbody tr:hover { background: var(--panel-2); }
  .times td.time { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .times td.best { color: var(--ready); font-weight: 600; }
  .times .empty { padding: 32px 16px; color: var(--muted); text-align: center; }
  .sidebar footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  /* --- main --- */
  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    transition: background 0.15s;
    min-height: 0;
  }
  .main.holding { background: #2a1519; }
  .main.ready { background: #12291c; }
  .main.inspecting { background: #1d1f2a; }
  .scramble {
    font-family: var(--mono);
    font-size: clamp(16px, 2.2vw, 28px);
    line-height: 1.6;
    text-align: center;
    max-width: 900px;
    color: var(--text);
    margin-bottom: 40px;
    min-height: 2em;
    white-space: pre-line;
    max-height: 40vh;
    overflow-y: auto;
  }
  .scramble.long { font-size: clamp(14px, 1.6vw, 22px); }
  .scramble.multi { text-align: left; font-size: clamp(13px, 1.5vw, 20px); }
  .scramble.hidden-during-solve { visibility: hidden; }
  .timer {
    font-family: var(--mono);
    font-size: clamp(64px, 14vw, 180px);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    transition: color 0.1s;
  }
  .main.holding .timer { color: var(--hold); }
  .main.ready .timer { color: var(--ready); }
  .main.inspecting .timer { color: var(--accent); }
  .penalty-bar { margin-top: 20px; display: flex; gap: 8px; min-height: 34px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .hint { margin-top: 32px; color: var(--muted); font-size: 14px; text-align: center; max-width: 520px; }
  .topbar {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  button, select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
    font-family: var(--font);
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover { border-color: var(--hold); color: var(--hold); }
  button.small { padding: 4px 8px; font-size: 12px; }
  label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  label.check.disabled { opacity: 0.4; cursor: default; }
  /* --- modal --- */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    width: min(560px, 90vw);
    max-height: 90vh;
    overflow-y: auto;
    -webkit-user-select: text;
    user-select: text;
  }
  .modal h2 { margin: 0 0 12px; font-size: 18px; }
  .modal .big { font-family: var(--mono); font-size: 40px; margin-bottom: 8px; }
  .modal .scr { font-family: var(--mono); color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 16px; white-space: pre-line; }
  .modal .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .modal .row .spacer { flex: 1; }
  /* --- responsive --- */
  @media (max-width: 800px) {
    body { overflow: auto; }
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
    .sidebar { order: 2; border-right: none; border-top: 1px solid var(--border); max-height: 50vh; }
    .main { order: 1; min-height: 60vh; }
    .topbar { position: static; margin-bottom: 16px; justify-content: center; }
    .scramble { max-height: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header>
      <h1>Cube Timer</h1>
      <select id="cubeType" title="Konkurencja"></select>
    </header>
    <div class="stats" id="stats"></div>
    <div class="times" id="timesList"></div>
    <footer>
      <button id="btnExport" class="small">Eksportuj CSV</button>
      <button id="btnClear" class="small danger">Wyczyść sesję</button>
    </footer>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <label class="check" id="inspWrap"><input type="checkbox" id="optInspection"> Inspekcja 15s</label>
      <label class="check"><input type="checkbox" id="optHideTime"> Ukryj czas</label>
      <button id="btnNewScramble" class="small">Nowy scramble (N)</button>
    </div>
    <div class="scramble" id="scramble"></div>
    <div class="timer" id="timer">0.00</div>
    <div class="penalty-bar" id="penaltyBar"></div>
    <div class="hint" id="hint"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="mTitle">Ułożenie</h2>
    <div class="big" id="mTime"></div>
    <div class="scr" id="mScramble"></div>
    <div class="row">
      <span id="mControls" class="row"></span>
      <span class="spacer"></span>
      <button id="mDelete" class="danger">Usuń</button>
      <button id="mClose" class="primary">Zamknij</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const rnd = n => Math.floor(Math.random() * n);
  const pick = a => a[rnd(a.length)];
  const MODS = ['', "'", '2'];

  // ---------- Scramble generation ----------
  // NxN: faces grouped by axis (U/D, R/L, F/B). Within one axis run no move
  // (face + layer width) repeats and the run is capped, so redundant sequences
  // like R L R or U U' are never produced.
  const FACES = ['U', 'D', 'R', 'L', 'F', 'B'];
  function genNxN(n, length) {
    const moves = [];
    const maxRun = n >= 4 ? 3 : 2;
    let runAxis = -1, run = [];
    while (moves.length < length) {
      const f = rnd(6), axis = f >> 1;
      let width = 1;
      if (n >= 4) {
        const r = Math.random();
        if (n >= 6 && r < 0.25) width = 3;
        else if (r < 0.5) width = 2;
      }
      const key = FACES[f] + width;
      if (axis === runAxis) {
        if (run.length >= maxRun || run.includes(key)) continue;
        run.push(key);
      } else { runAxis = axis; run = [key]; }
      moves.push((width === 3 ? '3' : '') + FACES[f] + (width > 1 ? 'w' : '') + pick(MODS));
    }
    return moves.join(' ');
  }

  function gen222() {
    // 2x2 only needs R, U, F.
    const faces = ['R', 'U', 'F'];
    const moves = [];
    let last = null;
    const length = 9 + rnd(3);
    while (moves.length < length) {
      const f = pick(faces);
      if (f === last) continue;
      moves.push(f + pick(MODS));
      last = f;
    }
    return moves.join(' ');
  }

  // Blindfolded: random orientation appended after the scramble (WCA style).
  function orientation(xs, ys) {
    const parts = [];
    if (Math.random() < 0.8) parts.push(pick(xs));
    if (Math.random() < 0.75) parts.push(pick(ys));
    return parts.length ? ' ' + parts.join(' ') : '';
  }
  const gen333bf = () => genNxN(3, 20) + orientation(['Rw', "Rw'", 'Rw2', 'Fw', "Fw'"], ['Uw', "Uw'", 'Uw2']);
  const gen444bf = () => genNxN(4, 40) + orientation(['x', "x'", 'x2', 'z', "z'"], ['y', "y'", 'y2']);
  const gen555bf = () => genNxN(5, 60) + orientation(['x', "x'", 'x2', 'z', "z'"], ['y', "y'", 'y2']);

  // Clock: 9 pins-up moves, y2, 5 more moves, then the pins left up at the end.
  function genClock() {
    const v = () => { const n = rnd(12) - 5; return n === 0 ? '0+' : Math.abs(n) + (n > 0 ? '+' : '-'); };
    const a = ['UR', 'DR', 'DL', 'UL', 'U', 'R', 'D', 'L', 'ALL'].map(p => p + v());
    const b = ['U', 'R', 'D', 'L', 'ALL'].map(p => p + v());
    const pins = ['UR', 'DR', 'DL', 'UL'].filter(() => Math.random() < 0.5);
    return [...a, 'y2', ...b, ...pins].join(' ');
  }

  // Megaminx: Pochmann notation, 7 lines of R±± / D±± pairs ending in U / U'.
  function genMinx() {
    const lines = [];
    for (let i = 0; i < 7; i++) {
      const m = [];
      for (let j = 0; j < 10; j++) m.push((j % 2 ? 'D' : 'R') + (Math.random() < 0.5 ? '++' : '--'));
      m.push(Math.random() < 0.5 ? 'U' : "U'");
      lines.push(m.join(' '));
    }
    return lines.join('\n');
  }

  function genCorner(faces, length, mods) {
    const m = [];
    let last = null;
    while (m.length < length) {
      const f = pick(faces);
      if (f === last) continue;
      last = f;
      m.push(f + pick(mods));
    }
    return m;
  }
  function genPyram() {
    const m = genCorner(['U', 'L', 'R', 'B'], 10, ['', "'"]);
    const tips = ['u', 'l', 'r', 'b'].map(t => { const r = rnd(3); return r === 0 ? '' : t + (r === 1 ? '' : "'"); }).filter(Boolean);
    return m.concat(tips).join(' ');
  }
  const genSkewb = () => genCorner(['U', 'L', 'R', 'B'], 11, ['', "'"]).join(' ');

  // Square-1: the puzzle is simulated so every "/" is a legal slice.
  // Each layer is 12 slots of 30°; a corner occupies two slots, an edge one.
  // A slice is legal when slots 0|11 and 5|6 are piece boundaries on both layers.
  function genSq1(pairs) {
    let top = [0, 0, 1, 2, 2, 3, 4, 4, 5, 6, 6, 7];
    let bot = [8, 8, 9, 10, 10, 11, 12, 12, 13, 14, 14, 15];
    const rot = (arr, k) => { k = ((k % 12) + 12) % 12; return arr.slice(k).concat(arr.slice(0, k)); };
    const ok = arr => arr[0] !== arr[11] && arr[5] !== arr[6];
    const out = [];
    while (out.length < pairs) {
      const a = rnd(12) - 5, b = rnd(12) - 5; // -5 .. 6
      if (a === 0 && b === 0) continue;
      const t = rot(top, a), bo = rot(bot, b);
      if (!ok(t) || !ok(bo)) continue;
      // slice: the right halves swap layers and are mirrored
      const tr = t.slice(0, 6).reverse(), br = bo.slice(0, 6).reverse();
      top = br.concat(t.slice(6));
      bot = tr.concat(bo.slice(6));
      out.push(`(${a},${b})`);
    }
    return out.join(' / ');
  }

  // FTO (Face-Turning Octahedron): 8 faces in 4 opposite pairs, order-3 turns.
  const FTO_AXES = [['U', 'D'], ['F', 'B'], ['L', 'BR'], ['R', 'BL']];
  function genFTO(length) {
    const m = [];
    let lastAxis = -1, lastFace = null, run = 0;
    while (m.length < length) {
      const ax = rnd(4), f = FTO_AXES[ax][rnd(2)];
      if (ax === lastAxis) {
        if (f === lastFace || run >= 2) continue;
        run++;
      } else run = 1;
      lastAxis = ax; lastFace = f;
      m.push(f + pick(['', "'"]));
    }
    return m.join(' ');
  }

  // ---------- Events ----------
  // fmt: 'ao'  -> ao5 / ao12 / ao100 (WCA average of 5 format)
  //      'mo3' -> mean of 3 (6x6, 7x7, blindfolded)
  const EVENTS = {
    '333':    { name: '3x3x3',                 group: 'wca', fmt: 'ao',  insp: true,  scr: () => genNxN(3, 20) },
    '222':    { name: '2x2x2',                 group: 'wca', fmt: 'ao',  insp: true,  scr: gen222 },
    '444':    { name: '4x4x4',                 group: 'wca', fmt: 'ao',  insp: true,  scr: () => genNxN(4, 40) },
    '555':    { name: '5x5x5',                 group: 'wca', fmt: 'ao',  insp: true,  scr: () => genNxN(5, 60) },
    '666':    { name: '6x6x6',                 group: 'wca', fmt: 'mo3', insp: true,  scr: () => genNxN(6, 80) },
    '777':    { name: '7x7x7',                 group: 'wca', fmt: 'mo3', insp: true,  scr: () => genNxN(7, 100) },
    '333bf':  { name: '3x3x3 bez patrzenia',   group: 'wca', fmt: 'mo3', insp: false, scr: gen333bf },
    '333oh':  { name: '3x3x3 jedną ręką',      group: 'wca', fmt: 'ao',  insp: true,  scr: () => genNxN(3, 20) },
    'clock':  { name: 'Clock',                 group: 'wca', fmt: 'ao',  insp: true,  scr: genClock },
    'minx':   { name: 'Megaminx',              group: 'wca', fmt: 'ao',  insp: true,  scr: genMinx },
    'pyram':  { name: 'Pyraminx',              group: 'wca', fmt: 'ao',  insp: true,  scr: genPyram },
    'skewb':  { name: 'Skewb',                 group: 'wca', fmt: 'ao',  insp: true,  scr: genSkewb },
    'sq1':    { name: 'Square-1',              group: 'wca', fmt: 'ao',  insp: true,  scr: () => genSq1(12 + rnd(3)) },
    '444bf':  { name: '4x4x4 bez patrzenia',   group: 'wca', fmt: 'mo3', insp: false, scr: gen444bf },
    '555bf':  { name: '5x5x5 bez patrzenia',   group: 'wca', fmt: 'mo3', insp: false, scr: gen555bf },
    'fto':    { name: 'FTO (Face-Turning Octahedron)', group: 'other', fmt: 'ao', insp: true, scr: () => genFTO(30) },
  };
  const GROUPS = { wca: 'Oficjalne konkurencje WCA', other: 'Nieoficjalne' };

  // ---------- Formatting ----------
  function fmt(ms, decimals = 2) {
    if (ms == null || !isFinite(ms)) return 'DNF';
    const total = Math.floor(ms);
    const m = Math.floor(total / 60000);
    const s = (total % 60000) / 1000;
    const sStr = s.toFixed(decimals);
    if (m > 0) return `${m}:${sStr.padStart(decimals + 3, '0')}`;
    return sStr;
  }

  function effectiveMs(solve) {
    if (solve.penalty === 'DNF') return Infinity;
    if (solve.penalty === '+2') return solve.ms + 2000;
    return solve.ms;
  }

  function fmtSolve(solve) {
    if (solve.penalty === 'DNF') return 'DNF';
    return fmt(effectiveMs(solve)) + (solve.penalty === '+2' ? '+' : '');
  }

  // ---------- Stats ----------
  function average(solves) {
    // WCA average: trim 5% from each end (1 for ao5/ao12, 5 for ao100), mean the rest.
    const n = solves.length;
    if (n < 3) return null;
    const vals = solves.map(effectiveMs).sort((a, b) => a - b);
    const trim = Math.ceil(n * 0.05);
    const dnfs = vals.filter(v => v === Infinity).length;
    if (dnfs > trim) return Infinity; // more DNFs than can be trimmed => average is DNF
    const kept = vals.slice(trim, n - trim);
    return kept.reduce((a, b) => a + b, 0) / kept.length;
  }
  function meanOf(solves) {
    // WCA mean: any DNF => DNF.
    const vals = solves.map(effectiveMs);
    if (vals.includes(Infinity)) return Infinity;
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  }
  function lastN(solves, n, f) {
    if (solves.length < n) return null;
    return f(solves.slice(-n));
  }
  function bestN(solves, n, f) {
    if (solves.length < n) return null;
    let best = null;
    for (let i = 0; i + n <= solves.length; i++) {
      const a = f(solves.slice(i, i + n));
      if (a === null) continue;
      if (best === null || a < best) best = a;
    }
    return best;
  }
  function mean(solves) {
    const valid = solves.map(effectiveMs).filter(v => v !== Infinity);
    if (!valid.length) return null;
    return valid.reduce((a, b) => a + b, 0) / valid.length;
  }
  function bestSolve(list) {
    const valid = list.filter(s => effectiveMs(s) !== Infinity);
    if (!valid.length) return null;
    return valid.reduce((a, b) => effectiveMs(a) < effectiveMs(b) ? a : b);
  }

  // ---------- State ----------
  const STORAGE_KEY = 'cubeTimer.v1';
  let state = { sessions: {}, cubeType: '333', inspection: false, hideTime: false };

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        state = Object.assign(state, parsed);
        state.sessions = parsed.sessions || {};
      }
    } catch (e) { /* ignore corrupt storage */ }
    if (!EVENTS[state.cubeType]) state.cubeType = '333';
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* quota etc. */ }
  }
  function solves() { return state.sessions[state.cubeType] || (state.sessions[state.cubeType] = []); }
  function event() { return EVENTS[state.cubeType]; }
  function inspectionActive() { return state.inspection && event().insp; }

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const el = {
    main: $('main'), timer: $('timer'), scramble: $('scramble'), hint: $('hint'),
    penaltyBar: $('penaltyBar'), timesList: $('timesList'), cubeType: $('cubeType'),
    optInspection: $('optInspection'), inspWrap: $('inspWrap'), optHideTime: $('optHideTime'),
    stats: $('stats'),
    modalBg: $('modalBg'), mTitle: $('mTitle'), mTime: $('mTime'), mScramble: $('mScramble'), mControls: $('mControls'),
  };

  // Fill the event selector, grouped.
  for (const [gid, gname] of Object.entries(GROUPS)) {
    const og = document.createElement('optgroup');
    og.label = gname;
    for (const [id, ev] of Object.entries(EVENTS)) {
      if (ev.group !== gid) continue;
      const o = document.createElement('option');
      o.value = id; o.textContent = ev.name;
      og.appendChild(o);
    }
    el.cubeType.appendChild(og);
  }

  // ---------- Timer machine ----------
  // States: idle -> holding -> ready -> running -> idle
  //         idle -> (inspection) inspecting -> inspHolding -> inspReady -> running
  const HOLD_MS = 500;
  const INSPECTION_MS = 15000;

  let phase = 'idle';
  let holdTimer = null;
  let startTime = 0;
  let rafId = null;
  let inspectionStart = 0;
  let inspectionPenalty = null; // null | '+2' | 'DNF'
  let currentScramble = '';
  let lastSolveId = null;

  function idleHint() {
    const ev = event();
    if (!ev.insp) return 'Bez inspekcji: zapamiętywanie liczy się do czasu. Przytrzymaj <b>spację</b> (lub dotknij ekran), aż timer zrobi się zielony, potem puść, aby wystartować.';
    return 'Przytrzymaj <b>spację</b> (lub dotknij ekran), aż timer zrobi się zielony, potem puść, aby wystartować.';
  }

  function setPhase(p) {
    phase = p;
    el.main.classList.toggle('holding', p === 'holding' || p === 'inspHolding');
    el.main.classList.toggle('ready', p === 'ready' || p === 'inspReady');
    el.main.classList.toggle('inspecting', p === 'inspecting' || p === 'inspHolding' || p === 'inspReady');
    el.scramble.classList.toggle('hidden-during-solve', p === 'running');
    if (p === 'running') {
      el.hint.textContent = 'Naciśnij dowolny klawisz, aby zatrzymać.';
      el.penaltyBar.innerHTML = '';
    } else if (p === 'inspecting') {
      el.hint.textContent = 'Inspekcja. Przytrzymaj spację, aby wystartować.';
    } else if (p === 'idle') {
      el.hint.innerHTML = idleHint();
    }
  }

  function newScramble() {
    currentScramble = event().scr();
    el.scramble.textContent = currentScramble;
    el.scramble.classList.toggle('multi', currentScramble.includes('\n'));
    el.scramble.classList.toggle('long', !currentScramble.includes('\n') && currentScramble.length > 130);
  }

  function tick() {
    if (phase === 'running') {
      const elapsed = performance.now() - startTime;
      el.timer.textContent = state.hideTime ? '···' : fmt(elapsed, 1);
      rafId = requestAnimationFrame(tick);
    } else if (phase === 'inspecting' || phase === 'inspHolding' || phase === 'inspReady') {
      const elapsed = performance.now() - inspectionStart;
      const left = INSPECTION_MS - elapsed;
      if (left > -2000) {
        el.timer.textContent = left > 0 ? Math.ceil(left / 1000) : '+2';
        inspectionPenalty = left > 0 ? null : '+2';
      } else {
        el.timer.textContent = 'DNF';
        inspectionPenalty = 'DNF';
      }
      rafId = requestAnimationFrame(tick);
    }
  }

  function startInspection() {
    inspectionStart = performance.now();
    inspectionPenalty = null;
    setPhase('inspecting');
    cancelAnimationFrame(rafId);
    tick();
  }

  function startRunning() {
    startTime = performance.now();
    setPhase('running');
    cancelAnimationFrame(rafId);
    tick();
  }

  function stopRunning() {
    const endTime = performance.now();
    cancelAnimationFrame(rafId);
    const ms = endTime - startTime;
    const solve = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      ms: Math.round(ms),
      penalty: inspectionPenalty,
      scramble: currentScramble,
      date: new Date().toISOString(),
    };
    solves().push(solve);
    lastSolveId = solve.id;
    save();
    setPhase('idle');
    el.timer.textContent = fmtSolve(solve);
    renderPenaltyBar(solve);
    render();
    newScramble();
  }

  // Controls for one solve: OK / +2 / DNF.
  function resultControls(solve, onChange) {
    const frag = document.createDocumentFragment();
    const mk = (label, pen) => {
      const b = document.createElement('button');
      b.className = 'small';
      b.textContent = label;
      if (solve.penalty === pen) b.classList.add('primary');
      b.addEventListener('click', e => { e.stopPropagation(); setPenalty(solve.id, pen); onChange && onChange(); });
      return b;
    };
    frag.append(mk('OK', null), mk('+2', '+2'), mk('DNF', 'DNF'));
    return frag;
  }

  function renderPenaltyBar(solve) {
    el.penaltyBar.innerHTML = '';
    el.penaltyBar.append(resultControls(solve, () => {
      const s = solves().find(x => x.id === solve.id);
      if (s) renderPenaltyBar(s);
    }));
    const del = document.createElement('button');
    del.className = 'small danger';
    del.textContent = 'Usuń';
    del.addEventListener('click', e => { e.stopPropagation(); deleteSolve(solve.id); });
    el.penaltyBar.append(del);
  }

  function setPenalty(id, pen) {
    const s = solves().find(x => x.id === id);
    if (!s) return;
    s.penalty = pen;
    save();
    if (id === lastSolveId && phase === 'idle') el.timer.textContent = fmtSolve(s);
    render();
  }

  function deleteSolve(id) {
    const list = solves();
    const idx = list.findIndex(x => x.id === id);
    if (idx < 0) return;
    list.splice(idx, 1);
    save();
    if (id === lastSolveId) {
      lastSolveId = null;
      el.timer.textContent = '0.00';
      el.penaltyBar.innerHTML = '';
    }
    closeModal();
    render();
  }

  // ---------- Input handling ----------
  function press() {
    if (el.modalBg.classList.contains('open')) return;
    if (phase === 'running') { stopRunning(); return; }
    if (phase === 'idle') {
      if (inspectionActive()) { startInspection(); return; }
      beginHold('holding', 'ready');
    } else if (phase === 'inspecting') {
      beginHold('inspHolding', 'inspReady');
    }
  }

  function beginHold(holdPhase, readyPhase) {
    setPhase(holdPhase);
    if (holdPhase === 'holding') el.timer.textContent = '0.00';
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { if (phase === holdPhase) setPhase(readyPhase); }, HOLD_MS);
  }

  function release() {
    clearTimeout(holdTimer);
    if (phase === 'ready' || phase === 'inspReady') {
      startRunning();
    } else if (phase === 'holding') {
      setPhase('idle');
      if (lastSolveId) {
        const s = solves().find(x => x.id === lastSolveId);
        if (s) el.timer.textContent = fmtSolve(s);
      }
    } else if (phase === 'inspHolding') {
      setPhase('inspecting');
    }
  }

  let spaceDown = false;
  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (phase === 'running') { e.preventDefault(); stopRunning(); return; }
    if (e.code === 'Space') { e.preventDefault(); spaceDown = true; press(); }
    else if (e.code === 'Escape') {
      if (el.modalBg.classList.contains('open')) closeModal();
      else if (phase.startsWith('insp')) { cancelAnimationFrame(rafId); setPhase('idle'); el.timer.textContent = '0.00'; }
    }
    else if (e.key === 'n' || e.key === 'N') newScramble();
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'Space' && spaceDown) { e.preventDefault(); spaceDown = false; release(); }
  });

  // Touch / mouse on the main area (mobile support).
  let pointerDown = false;
  el.main.addEventListener('pointerdown', e => {
    if (e.target.closest('button, select, label, input, .topbar, .scramble')) return;
    e.preventDefault();
    pointerDown = true;
    press();
  });
  const pointerUp = () => { if (pointerDown) { pointerDown = false; release(); } };
  el.main.addEventListener('pointerup', pointerUp);
  el.main.addEventListener('pointercancel', pointerUp);
  el.main.addEventListener('pointerleave', pointerUp);

  // ---------- Rendering ----------
  const dash = v => v == null ? '–' : fmt(v);

  function render() {
    const list = solves();
    const n = list.length;
    const ev = event();
    const best = bestSolve(list);

    const rows = [['Liczba ułożeń', n], ['Najlepszy', best ? fmtSolve(best) : '–']];
    if (ev.fmt === 'ao') {
      rows.push(['Średnia (wszystkie)', dash(mean(list))]);
      rows.push(['ao5', dash(lastN(list, 5, average))], ['ao12', dash(lastN(list, 12, average))], ['ao100', dash(lastN(list, 100, average))]);
      rows.push(['Najlepsze ao5', dash(bestN(list, 5, average))], ['Najlepsze ao12', dash(bestN(list, 12, average))]);
    } else {
      rows.push(['Średnia (wszystkie)', dash(mean(list))]);
      rows.push(['mo3', dash(lastN(list, 3, meanOf))], ['Najlepsze mo3', dash(bestN(list, 3, meanOf))]);
      rows.push(['ao5', dash(lastN(list, 5, average))], ['ao12', dash(lastN(list, 12, average))]);
    }
    el.stats.innerHTML = rows.map(([l, v]) => `<span class="label">${l}</span><span class="value">${v}</span>`).join('');

    if (!n) {
      el.timesList.innerHTML = '<div class="empty">Brak ułożeń w tej sesji.<br>Zacznij układać!</div>';
      return;
    }
    const trs = [];
    for (let i = n - 1; i >= 0; i--) {
      const s = list[i];
      const isBest = best && s.id === best.id;
      let extra = '';
      if (ev.fmt === 'ao') {
        const a5 = i >= 4 ? average(list.slice(i - 4, i + 1)) : null;
        const a12 = i >= 11 ? average(list.slice(i - 11, i + 1)) : null;
        extra = `<td class="time">${a5 == null ? '' : fmt(a5)}</td><td class="time">${a12 == null ? '' : fmt(a12)}</td>`;
      } else {
        const m3 = i >= 2 ? meanOf(list.slice(i - 2, i + 1)) : null;
        extra = `<td class="time">${m3 == null ? '' : fmt(m3)}</td>`;
      }
      trs.push(`<tr data-id="${s.id}"><td>${i + 1}</td><td class="time${isBest ? ' best' : ''}">${fmtSolve(s)}</td>${extra}</tr>`);
    }
    const head = ev.fmt === 'ao' ? '<th>czas</th><th>ao5</th><th>ao12</th>' : '<th>czas</th><th>mo3</th>';
    el.timesList.innerHTML = `<table><thead><tr><th>#</th>${head}</tr></thead><tbody>${trs.join('')}</tbody></table>`;
  }

  el.timesList.addEventListener('click', e => {
    const tr = e.target.closest('tr[data-id]');
    if (tr) openModal(tr.dataset.id);
  });

  // ---------- Modal ----------
  let modalId = null;
  function openModal(id) {
    const s = solves().find(x => x.id === id);
    if (!s) return;
    modalId = id;
    const idx = solves().indexOf(s) + 1;
    el.mTitle.textContent = `Ułożenie #${idx} · ${new Date(s.date).toLocaleString('pl-PL')}`;
    el.mTime.textContent = fmtSolve(s);
    el.mScramble.textContent = s.scramble;
    el.mControls.innerHTML = '';
    el.mControls.append(resultControls(s, () => openModal(id)));
    el.modalBg.classList.add('open');
  }
  function closeModal() { el.modalBg.classList.remove('open'); modalId = null; }
  $('mDelete').addEventListener('click', () => { if (confirm('Usunąć to ułożenie?')) deleteSolve(modalId); });
  $('mClose').addEventListener('click', closeModal);
  el.modalBg.addEventListener('click', e => { if (e.target === el.modalBg) closeModal(); });

  // ---------- Controls ----------
  function applyEventUI() {
    const ev = event();
    el.inspWrap.classList.toggle('disabled', !ev.insp);
    el.optInspection.disabled = !ev.insp;
    el.optInspection.checked = !!state.inspection && ev.insp;
    el.inspWrap.title = ev.insp ? '' : 'W tej konkurencji nie ma inspekcji';
  }
  function resetDisplay() {
    lastSolveId = null;
    el.timer.textContent = '0.00';
    el.penaltyBar.innerHTML = '';
  }
  el.cubeType.addEventListener('change', () => {
    state.cubeType = el.cubeType.value;
    resetDisplay();
    applyEventUI();
    save(); render(); newScramble(); setPhase('idle');
    el.cubeType.blur();
  });
  el.optInspection.addEventListener('change', () => { state.inspection = el.optInspection.checked; save(); el.optInspection.blur(); });
  el.optHideTime.addEventListener('change', () => { state.hideTime = el.optHideTime.checked; save(); el.optHideTime.blur(); });
  $('btnNewScramble').addEventListener('click', e => { newScramble(); e.target.blur(); });
  $('btnClear').addEventListener('click', () => {
    if (!solves().length) return;
    if (confirm('Wyczyścić wszystkie czasy w tej sesji?')) {
      state.sessions[state.cubeType] = [];
      resetDisplay();
      save(); render();
    }
  });
  $('btnExport').addEventListener('click', () => {
    const list = solves();
    if (!list.length) return;
    const esc = v => `"${String(v).replace(/"/g, '""')}"`;
    const lines = ['nr,czas_ms,kara,wynik,scramble,data'];
    list.forEach((s, i) => lines.push([i + 1, s.ms, s.penalty || '', fmtSolve(s), esc(s.scramble), s.date].join(',')));
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `cube-timer-${state.cubeType}-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // ---------- Init ----------
  load();
  el.cubeType.value = state.cubeType;
  el.optHideTime.checked = !!state.hideTime;
  applyEventUI();
  render();
  newScramble();
  setPhase('idle');
})();
</script>
</body>
</html>
